name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  storefront:
    name: Storefront
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/storefront
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type check
        run: npm run typecheck
      - name: Catalog source contract
        run: npm run test:catalog
      - name: Install browser for catalog integration
        run: npx playwright install --with-deps chromium
      - name: Live catalog browser integration
        run: npm run test:browser
      - name: Production static preview build
        run: npm run build
        env:
          MAZEDUNEH_STATIC_EXPORT: 'true'
      - name: Upload storefront preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: mazeduneh-storefront-preview
          path: apps/storefront/out

  api:
    name: API
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mazeduneh
          POSTGRES_PASSWORD: mazeduneh_ci
          POSTGRES_DB: mazeduneh
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mazeduneh -d mazeduneh"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ConnectionStrings__Catalog: Host=127.0.0.1;Port=5432;Database=mazeduneh;Username=mazeduneh;Password=mazeduneh_ci
      Admin__Email: ci-owner@mazeduneh.test
      Admin__PasswordHash: e285b7f5f8dd444780a92a2831698caa12a03c5b12c66d4b4a4c6f4688216ea2
      Admin__TokenSigningKey: mazeduneh-ci-signing-key-must-be-long-and-private
      Payments__SandboxEnabled: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore services/api/Mazeduneh.Api.csproj
      - name: Build
        run: dotnet build services/api/Mazeduneh.Api.csproj --configuration Release --no-restore
      - name: Durable checkout payment and order operations contract
        shell: bash
        run: |
          set -euo pipefail
          start_api() {
            dotnet run --project services/api/Mazeduneh.Api.csproj --configuration Release --no-build --urls http://127.0.0.1:5099 > /tmp/mazeduneh-api.log 2>&1 &
            API_PID=$!
            export API_PID
            for attempt in $(seq 1 40); do
              if curl -fsS http://127.0.0.1:5099/health > /dev/null; then return 0; fi
              sleep 1
            done
            cat /tmp/mazeduneh-api.log
            return 1
          }
          stop_api() {
            kill "$API_PID" || true
            wait "$API_PID" || true
          }
          start_role_api() {
            Admin__Role=${ADMIN_ROLE:-ReadOnlyAnalyst} dotnet run --project services/api/Mazeduneh.Api.csproj --configuration Release --no-build --urls http://127.0.0.1:5100 > /tmp/mazeduneh-role-api.log 2>&1 &
            ROLE_API_PID=$!
            export ROLE_API_PID
            for attempt in $(seq 1 40); do
              if curl -fsS http://127.0.0.1:5100/health > /dev/null; then return 0; fi
              sleep 1
            done
            cat /tmp/mazeduneh-role-api.log
            return 1
          }
          stop_role_api() {
            if [[ -n "${ROLE_API_PID:-}" ]]; then
              kill "$ROLE_API_PID" || true
              wait "$ROLE_API_PID" || true
            fi
          }
          trap 'stop_api; stop_role_api' EXIT
          start_api

          curl -fsS -X POST http://127.0.0.1:5099/api/v1/checkout/orders \
            -H 'Content-Type: application/json' \
            -H 'Idempotency-Key: ci-checkout-0001' \
            --data '{"customerName":"تست CI","mobile":"09120000000","province":"تهران","city":"تهران","address":"نشانی تست قرارداد","postalCode":"1234567890","lines":[{"sku":"PI-AKB-250","quantity":1}]}' \
            > /tmp/order-created.json

          curl -fsS -X POST http://127.0.0.1:5099/api/v1/checkout/orders \
            -H 'Content-Type: application/json' \
            -H 'Idempotency-Key: ci-checkout-0001' \
            --data '{"customerName":"تست CI","mobile":"09120000000","province":"تهران","city":"تهران","address":"نشانی تست قرارداد","postalCode":"1234567890","lines":[{"sku":"PI-AKB-250","quantity":1}]}' \
            > /tmp/order-replayed.json

          python3 - <<'PY'
          import json
          created = json.load(open('/tmp/order-created.json', encoding='utf-8'))
          replayed = json.load(open('/tmp/order-replayed.json', encoding='utf-8'))
          assert created['id'] == replayed['id']
          assert created['payable'] == replayed['payable']
          assert created['state'] == 'AwaitingPayment'
          open('/tmp/order-id', 'w').write(created['id'])
          open('/tmp/receipt-token', 'w').write(created['receiptToken'])
          PY

          stop_api
          start_api
          ORDER_ID=$(cat /tmp/order-id)
          RECEIPT_TOKEN=$(cat /tmp/receipt-token)
          curl -fsS "http://127.0.0.1:5099/api/v1/checkout/orders/${ORDER_ID}?receiptToken=${RECEIPT_TOKEN}" > /tmp/order-after-restart.json

          curl -fsS -X POST "http://127.0.0.1:5099/api/v1/payments/orders/${ORDER_ID}/intent" \
            -H 'Content-Type: application/json' --data "{\"receiptToken\":\"${RECEIPT_TOKEN}\"}" > /tmp/payment-intent.json
          AUTHORITY=$(python3 -c "import json; print(json.load(open('/tmp/payment-intent.json'))['authority'])")
          curl -fsS -X POST "http://127.0.0.1:5099/api/v1/payments/sandbox/${AUTHORITY}/complete" \
            -H 'Content-Type: application/json' --data "{\"receiptToken\":\"${RECEIPT_TOKEN}\"}" > /tmp/payment-completed.json
          curl -fsS -X POST "http://127.0.0.1:5099/api/v1/payments/sandbox/${AUTHORITY}/complete" \
            -H 'Content-Type: application/json' --data "{\"receiptToken\":\"${RECEIPT_TOKEN}\"}" > /tmp/payment-replayed.json

          python3 - <<'PY'
          import json
          completed = json.load(open('/tmp/payment-completed.json', encoding='utf-8'))
          replayed = json.load(open('/tmp/payment-replayed.json', encoding='utf-8'))
          assert completed['id'] == replayed['id']
          assert completed['state'] == 'Succeeded'
          assert completed['reference']
          PY

          stop_api
          start_api
          curl -fsS "http://127.0.0.1:5099/api/v1/checkout/orders/${ORDER_ID}?receiptToken=${RECEIPT_TOKEN}" > /tmp/order-paid-after-restart.json

          curl -fsS -X POST http://127.0.0.1:5099/api/v1/admin/auth/login \
            -H 'Content-Type: application/json' \
            --data '{"email":"ci-owner@mazeduneh.test","password":"Mazeduneh-CI-Owner-Password!"}' > /tmp/login.json
          python3 - <<'PY'
          import json
          login = json.load(open('/tmp/login.json', encoding='utf-8'))
          assert login['accessToken']
          assert login['tokenType'] == 'Bearer'
          assert login['role'] == 'Owner'
          assert 'orders.read' in login['permissions']
          assert 'products.write' in login['permissions']
          PY
          TOKEN=$(python3 -c "import json; print(json.load(open('/tmp/login.json'))['accessToken'])")
          curl -fsS http://127.0.0.1:5099/api/v1/admin/auth/session \
            -H "Authorization: Bearer ${TOKEN}" > /tmp/session.json
          python3 - <<'PY'
          import json
          session = json.load(open('/tmp/session.json', encoding='utf-8'))
          assert session['authenticated'] is True
          assert session['role'] == 'Owner'
          assert session['email'] == 'ci-owner@mazeduneh.test'
          assert 'orders.read' in session['permissions']
          assert 'products.write' in session['permissions']
          PY
          curl -fsS http://127.0.0.1:5099/api/v1/admin/users \
            -H "Authorization: Bearer ${TOKEN}" > /tmp/admin-users.json
          python3 - <<'PY'
          import json
          users = json.load(open('/tmp/admin-users.json', encoding='utf-8'))
          owner = next(item for item in users if item['email'] == 'ci-owner@mazeduneh.test')
          assert owner['role'] == 'Owner'
          assert owner['isActive'] is True
          assert 'inventory.write' in owner['permissions']
          PY
          curl -fsS http://127.0.0.1:5099/api/v1/admin/users/roles \
            -H "Authorization: Bearer ${TOKEN}" > /tmp/admin-roles.json
          python3 - <<'PY'
          import json
          roles = json.load(open('/tmp/admin-roles.json', encoding='utf-8'))
          warehouse = next(item for item in roles if item['role'] == 'WarehouseOperator')
          assert warehouse['titleFa'] == 'اپراتور انبار'
          assert 'inventory.write' in warehouse['permissions']
          PY
          curl -fsS -X POST http://127.0.0.1:5099/api/v1/admin/users \
            -H "Authorization: Bearer ${TOKEN}" -H 'Content-Type: application/json' \
            --data '{"email":"warehouse@example.test","displayName":"اپراتور انبار","role":"WarehouseOperator"}' > /tmp/admin-user-created.json
          USER_ID=$(python3 -c "import json; print(json.load(open('/tmp/admin-user-created.json'))['user']['id'])")
          python3 - <<'PY'
          import json
          response = json.load(open('/tmp/admin-user-created.json', encoding='utf-8'))
          created = response['user']
          assert response['invitationToken'] and response['expiresAt']
          assert created['role'] == 'WarehouseOperator'
          assert created['isActive'] is True
          assert 'inventory.write' in created['permissions']
          PY
          curl -fsS -X PATCH "http://127.0.0.1:5099/api/v1/admin/users/${USER_ID}/status" \
            -H "Authorization: Bearer ${TOKEN}" -H 'Content-Type: application/json' \
            --data '{"isActive":false}' > /tmp/admin-user-disabled.json
          python3 - <<'PY'
          import json
          disabled = json.load(open('/tmp/admin-user-disabled.json', encoding='utf-8'))
          assert disabled['isActive'] is False
          assert disabled['deactivatedAt']
          PY
          curl -fsS "http://127.0.0.1:5099/api/v1/admin/audit-log?entityType=AdminUser&entityId=${USER_ID}" \
            -H "Authorization: Bearer ${TOKEN}" > /tmp/admin-user-audit.json
          python3 - <<'PY'
          import json
          events = json.load(open('/tmp/admin-user-audit.json', encoding='utf-8'))
          assert {item['action'] for item in events} >= {'admin-user.invited', 'admin-user.status-changed'}
          assert all(item['actor'] == 'ci-owner@mazeduneh.test' for item in events)
          PY
          curl -fsS "http://127.0.0.1:5099/api/v1/admin/customers/?q=0912" \
            -H "Authorization: Bearer ${TOKEN}" > /tmp/customers.json
          python3 - <<'PY'
          import json
          customers = json.load(open('/tmp/customers.json', encoding='utf-8'))
          assert len(customers) == 1
          assert customers[0]['totalSpend'] > 0
          assert customers[0]['averageOrderValue'] > 0
          assert customers[0]['lastPurchaseAt']
          open('/tmp/customer-id', 'w').write(customers[0]['id'])
          PY

          PUBLISH_GUARD_STATUS=$(curl -s -o /tmp/publish-guard.json -w '%{http_code}' -X POST http://127.0.0.1:5099/api/v1/products/ \
            -H "Authorization: Bearer ${TOKEN}" -H 'Content-Type: application/json' \
            --data '{"title":"محصول ناقص","slug":"invalid-publish","category":"آزمایشی","origin":"ایران","currency":"IRR","unitType":"Weight","isPublished":true,"variants":[{"sku":"INVALID-1","quantity":250,"displayLabel":"۲۵۰ گرم","price":0,"availablePackages":0}]}' )
          test "${PUBLISH_GUARD_STATUS}" = "400"
          python3 - <<'PY'
          import json
          errors = json.load(open('/tmp/publish-guard.json', encoding='utf-8'))['errors']
          assert 'publication.variants' in errors
          PY

          PUBLISH_GUARD_STATUS=$(curl -s -o /tmp/publish-guard.json -w '%{http_code}' -X POST http://127.0.0.1:5099/api/v1/products/ \
            -H "Authorization: Bearer ${TOKEN}" -H 'Content-Type: application/json' \
            --data '{"title":"محصول ناقص","slug":"invalid-publish","category":"آزمایشی","origin":"ایران","currency":"IRR","unitType":"Weight","isPublished":true,"variants":[{"sku":"INVALID-1","quantity":250,"displayLabel":"۲۵۰ گرم","price":0,"availablePackages":0}]}' )
          test "${PUBLISH_GUARD_STATUS}" = "400"
          python3 - <<'PY'
          import json
          errors = json.load(open('/tmp/publish-guard.json', encoding='utf-8'))['errors']
          assert 'publication.variants' in errors
          PY

          curl -fsS -X POST http://127.0.0.1:5099/api/v1/corporate-requests \
            -H 'Content-Type: application/json' \
            --data '{"customerName":"تست سازمانی","companyName":"شرکت تست","mobile":"09121111111","email":"corporate@example.test","city":"تهران","occasion":"یلدا","orderQuantity":50,"packageType":"استاندارد","budget":125000000,"deliveryDate":"2030-12-20","customPackaging":true,"description":"قرارداد API"}' > /tmp/corporate-created.json
          python3 - <<'PY'
          import json
          created = json.load(open('/tmp/corporate-created.json', encoding='utf-8'))
          assert created['id'] and created['accessToken']
          open('/tmp/corporate-id', 'w').write(created['id'])
          PY
          CORPORATE_ID=$(cat /tmp/corporate-id)
          curl -fsS "http://127.0.0.1:5099/api/v1/admin/corporate-requests" -H "Authorization: Bearer ${TOKEN}" > /tmp/corporate-list.json
          python3 - <<'PY'
          import json
          items = json.load(open('/tmp/corporate-list.json', encoding='utf-8'))
          assert len(items) == 1 and items[0]['status'] == 'New'
          PY
          curl -fsS -X PATCH "http://127.0.0.1:5099/api/v1/admin/corporate-requests/${CORPORATE_ID}/status" \
            -H "Authorization: Bearer ${TOKEN}" -H 'Content-Type: application/json' \
            --data '{"status":"Reviewing","note":"contract-check"}' > /tmp/corporate-updated.json
          python3 - <<'PY'
          import json
          assert json.load(open('/tmp/corporate-updated.json', encoding='utf-8'))['status'] == 'Reviewing'
          PY

          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5099/api/v1/admin/orders)" = "401"

          python3 - <<'PY'
          import base64
          open('/tmp/media-test.png', 'wb').write(base64.b64decode('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII='))
          PY
          MEDIA_RESPONSE=$(curl -fsS -X POST http://127.0.0.1:5099/api/v1/admin/media \
            -H "Authorization: Bearer ${TOKEN}" \
            -F "file=@/tmp/media-test.png;type=image/png")
          python3 - <<'PY' "${MEDIA_RESPONSE}"
          import json, sys
          media = json.loads(sys.argv[1])
          assert media['key'].startswith('products/')
          assert media['url'].startswith('/media/')
          assert media['contentType'] == 'image/png'
          assert media['sizeBytes'] > 0
          open('/tmp/media-key', 'w').write(media['key'])
          PY
          MEDIA_KEY=$(cat /tmp/media-key)
          curl -fsS "http://127.0.0.1:5099/media/${MEDIA_KEY}" -o /tmp/media-downloaded.png
          cmp /tmp/media-test.png /tmp/media-downloaded.png
          curl -fsS "http://127.0.0.1:5099/api/v1/admin/media/metadata/${MEDIA_KEY}" \
            -H "Authorization: Bearer ${TOKEN}" > /tmp/media-metadata.json
          python3 - <<'PY'
          import json
          metadata = json.load(open('/tmp/media-metadata.json', encoding='utf-8'))
          assert metadata['contentType'] == 'image/png'
          assert metadata['sizeBytes'] > 0
          PY
          curl -fsS -X DELETE "http://127.0.0.1:5099/api/v1/admin/media/${MEDIA_KEY}" \
            -H "Authorization: Bearer ${TOKEN}" -o /dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:5099/media/${MEDIA_KEY}")" = "404"
          curl -fsS http://127.0.0.1:5099/api/v1/admin/orders -H "Authorization: Bearer ${TOKEN}" > /tmp/admin-orders.json
          curl -fsS "http://127.0.0.1:5099/api/v1/admin/inventory/movements?sku=PI-AKB-250" -H "Authorization: Bearer ${TOKEN}" > /tmp/stock-movements.json
          python3 - <<'PY'
          import json
          orders = json.load(open('/tmp/admin-orders.json', encoding='utf-8'))
          assert len(orders) == 1
          assert orders[0]['state'] == 'Paid'
          assert orders[0]['paymentReference']
          movements = json.load(open('/tmp/stock-movements.json', encoding='utf-8'))
          assert any(item['movementType'] == 'Reserved' and item['quantityDelta'] == -1 for item in movements)
          PY

          curl -fsS -X POST "http://127.0.0.1:5099/api/v1/admin/inventory/adjust" \
            -H "Authorization: Bearer ${TOKEN}" -H 'Content-Type: application/json' \
            --data '{"sku":"PI-AKB-250","quantityDelta":1,"reason":"ci-audit"}' -D /tmp/inventory-adjusted.headers > /tmp/inventory-adjusted.json
          curl -fsS "http://127.0.0.1:5099/api/v1/admin/audit-log?entityType=ProductVariant&entityId=PI-AKB-250&limit=20" \
            -H "Authorization: Bearer ${TOKEN}" > /tmp/inventory-audit-log.json
          python3 - <<'PY'
          import json
          audit = json.load(open('/tmp/inventory-audit-log.json', encoding='utf-8'))
          adjustment = next(item for item in audit if item['action'] == 'inventory.adjustment')
          assert adjustment['actor'] == 'ci-owner@mazeduneh.test'
          assert adjustment['beforeJson'] and adjustment['afterJson']
          assert adjustment['reason'] == 'ci-audit'
          headers = open('/tmp/inventory-adjusted.headers', encoding='utf-8').read().splitlines()
          request_id = next(line.split(':', 1)[1].strip() for line in headers if line.lower().startswith('x-request-id:'))
          assert adjustment['requestId'] == request_id
          PY

          curl -fsS -X POST http://127.0.0.1:5099/api/v1/admin/inventory/batches \
            -H "Authorization: Bearer ${TOKEN}" -H 'Content-Type: application/json' \
            --data '{"sku":"PI-AKB-250","batchCode":"CI-WASTE-LOT-1","receivedPackages":1,"producedAt":"2026-10-01T00:00:00Z","expiresAt":"2027-10-01T00:00:00Z","costPrice":1000,"purchasedAt":"2026-10-07T00:00:00Z","supplier":"CI Supplier"}' > /tmp/inventory-waste-batch.json
          WASTE_INVALID_STATUS=$(curl -s -o /tmp/inventory-waste-invalid.json -w '%{http_code}' -X POST http://127.0.0.1:5099/api/v1/admin/inventory/waste \
            -H "Authorization: Bearer ${TOKEN}" -H 'Content-Type: application/json' \
            --data '{"sku":"PI-AKB-250","batchCode":"CI-WASTE-LOT-1","quantity":0,"reason":"invalid"}')
          test "${WASTE_INVALID_STATUS}" = "400"
          WASTE_OVERFLOW_STATUS=$(curl -s -o /tmp/inventory-waste-overflow.json -w '%{http_code}' -X POST http://127.0.0.1:5099/api/v1/admin/inventory/waste \
            -H "Authorization: Bearer ${TOKEN}" -H 'Content-Type: application/json' \
            --data '{"sku":"PI-AKB-250","batchCode":"CI-WASTE-LOT-1","quantity":2,"reason":"over-batch"}')
          test "${WASTE_OVERFLOW_STATUS}" = "409"
          curl -fsS -D /tmp/inventory-waste.headers -X POST http://127.0.0.1:5099/api/v1/admin/inventory/waste \
            -H "Authorization: Bearer ${TOKEN}" -H 'Content-Type: application/json' \
            --data '{"sku":"PI-AKB-250","batchCode":"CI-WASTE-LOT-1","quantity":1,"reason":"ci-damaged-package"}' > /tmp/inventory-waste.json
          curl -fsS "http://127.0.0.1:5099/api/v1/admin/inventory/movements?sku=PI-AKB-250" \
            -H "Authorization: Bearer ${TOKEN}" > /tmp/inventory-waste-movements.json
          curl -fsS "http://127.0.0.1:5099/api/v1/admin/inventory/batches?sku=PI-AKB-250" \
            -H "Authorization: Bearer ${TOKEN}" > /tmp/inventory-waste-batches.json
          curl -fsS "http://127.0.0.1:5099/api/v1/admin/audit-log?entityType=ProductVariant&entityId=PI-AKB-250&limit=20" \
            -H "Authorization: Bearer ${TOKEN}" > /tmp/inventory-waste-audit.json
          python3 - <<'PY'
          import json
          movements = json.load(open('/tmp/inventory-waste-movements.json', encoding='utf-8'))
          waste = next(item for item in movements if item['movementType'] == 'Waste')
