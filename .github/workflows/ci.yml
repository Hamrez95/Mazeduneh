          batches = json.load(open('/tmp/inventory-waste-batches.json', encoding='utf-8'))
          batch = next(item for item in batches if item['batchCode'] == 'CI-WASTE-LOT-1')
          assert batch['remainingPackages'] == 0
          assert waste['actor'] == 'ci-owner@mazeduneh.test'
          assert waste['reason'] == 'ci-damaged-package'
          audit = json.load(open('/tmp/inventory-waste-audit.json', encoding='utf-8'))
          event = next(item for item in audit if item['action'] == 'inventory.waste')
          assert event['beforeJson'] and event['afterJson']
          assert event['reason'] == 'ci-damaged-package'
          headers = open('/tmp/inventory-waste.headers', encoding='utf-8').read().splitlines()
          request_id = next(line.split(':', 1)[1].strip() for line in headers if line.lower().startswith('x-request-id:'))
          assert event['requestId'] == request_id
          PY

          curl -fsS -X PATCH "http://127.0.0.1:5099/api/v1/products/pistachio-akbari-premium/publication" \
            -H "Authorization: Bearer ${TOKEN}" -H 'Content-Type: application/json' \
            --data '{"isPublished":false}' > /tmp/product-unpublished.json
          curl -fsS -X PATCH "http://127.0.0.1:5099/api/v1/products/pistachio-akbari-premium/publication" \
            -H "Authorization: Bearer ${TOKEN}" -H 'Content-Type: application/json' \
            --data '{"isPublished":true}' > /tmp/product-republished.json
          curl -fsS "http://127.0.0.1:5099/api/v1/admin/audit-log?entityType=Product&limit=20" \
            -H "Authorization: Bearer ${TOKEN}" > /tmp/audit-log.json
          python3 - <<'PY'
          import json
          audit = json.load(open('/tmp/audit-log.json', encoding='utf-8'))
          product_events = [item for item in audit if item['action'] == 'product.publication']
          assert len(product_events) >= 2
          assert product_events[0]['actor'] == 'ci-owner@mazeduneh.test'
          assert product_events[0]['beforeJson'] and product_events[0]['afterJson']
          PY

          curl -fsS -X POST "http://127.0.0.1:5099/api/v1/admin/orders/bulk-state" \
            -H "Authorization: Bearer ${TOKEN}" -H 'Content-Type: application/json' \
            --data "{\"orderIds\":[\"${ORDER_ID}\"],\"state\":\"Preparing\",\"reason\":\"ci-bulk\"}" > /tmp/order-bulk.json
          python3 - <<'PY'
          import json
