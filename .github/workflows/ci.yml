              --data "{\"state\":\"${STATE}\",\"reason\":\"ci-${STATE}\"}" -D "/tmp/order-${STATE}.headers" > "/tmp/order-${STATE}.json"
          done
          
          SHIPPING_INVALID_STATUS=$(curl -s -o /tmp/order-shipping-invalid.json -w '%{http_code}' -X PATCH "http://127.0.0.1:5099/api/v1/admin/orders/${ORDER_ID}/shipping" \
            -H "Authorization: Bearer ${TOKEN}" -H 'Content-Type: application/json' \
            --data '{"carrier":"پست","trackingCode":"CI-TRACK-1","actualShippingCost":12000}')
          test "${SHIPPING_INVALID_STATUS}" = "400"
          curl -fsS -D /tmp/order-shipping.headers -X PATCH "http://127.0.0.1:5099/api/v1/admin/orders/${ORDER_ID}/shipping" \
            -H "Authorization: Bearer ${TOKEN}" -H 'Content-Type: application/json' \
            --data '{"carrier":"پست","trackingCode":"CI-TRACK-1","actualShippingCost":12000,"reason":"ci-shipment-audit"}' > /tmp/order-shipping.json
          curl -fsS "http://127.0.0.1:5099/api/v1/admin/audit-log?entityType=Order&entityId=${ORDER_ID}" \
            -H "Authorization: Bearer ${TOKEN}" > /tmp/order-shipping-audit.json
          python3 - <<'PY'
          import json
          audit = json.load(open('/tmp/order-shipping-audit.json', encoding='utf-8'))
          event = next(item for item in audit if item['action'] == 'order.shipping-updated')
          assert event['actor'] == 'ci-owner@mazeduneh.test'
          assert event['beforeJson'] and event['afterJson']
          assert event['reason'] == 'ci-shipment-audit'
          assert json.loads(event['afterJson'])['trackingCode'] == 'CI-TRACK-1'
          headers = open('/tmp/order-shipping.headers', encoding='utf-8').read().splitlines()
          request_id = next(line.split(':', 1)[1].strip() for line in headers if line.lower().startswith('x-request-id:'))
          assert event['requestId'] == request_id
          PY

          curl -fsS http://127.0.0.1:5099/api/v1/admin/dashboard -H "Authorization: Bearer ${TOKEN}" > /tmp/dashboard.json
          curl -fsS "http://127.0.0.1:5099/api/v1/admin/audit-log?entityType=Order&entityId=${ORDER_ID}" \
            -H "Authorization: Bearer ${TOKEN}" > /tmp/order-state-audit.json
          python3 - <<'PY'
          import json
          events = json.load(open('/tmp/order-state-audit.json', encoding='utf-8'))
          event = next(item for item in events if item['action'] == 'order.state-changed' and json.loads(item['afterJson'])['state'] == 'Delivered')
          assert event['actor'] == 'ci-owner@mazeduneh.test'
          assert json.loads(event['beforeJson'])['state'] == 'Shipped'
          assert event['reason'] == 'ci-Delivered'
          headers = open('/tmp/order-Delivered.headers', encoding='utf-8').read().splitlines()
          request_id = next(line.split(':', 1)[1].strip() for line in headers if line.lower().startswith('x-request-id:'))
          assert event['requestId'] == request_id
          PY
          python3 - <<'PY'
          import json
          delivered = json.load(open('/tmp/order-Delivered.json', encoding='utf-8'))
          dashboard = json.load(open('/tmp/dashboard.json', encoding='utf-8'))
          assert delivered['state'] == 'Delivered'
          assert dashboard['delivered'] == 1
          assert dashboard['paidRevenue'] > 0
          assert dashboard['todayRevenue'] > 0
          assert 'expiringSoon' in dashboard
          assert dashboard['newCustomers'] >= 1
          assert dashboard['corporateNewRequests'] == 0
          assert dashboard['problemOrders'] == 0
          PY

          curl -fsS -X POST http://127.0.0.1:5099/api/v1/admin/auth/logout \
            -H "Authorization: Bearer ${TOKEN}" -o /dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5099/api/v1/admin/orders -H "Authorization: Bearer ${TOKEN}")" = "401"

          stop_api
          start_role_api
          curl -fsS -X POST http://127.0.0.1:5100/api/v1/admin/auth/login \
            -H 'Content-Type: application/json' \
            --data '{"email":"ci-owner@mazeduneh.test","password":"Mazeduneh-CI-Owner-Password!"}' > /tmp/read-only-login.json
          ROLE_TOKEN=$(python3 -c "import json; print(json.load(open('/tmp/read-only-login.json'))['accessToken'])")
          python3 - <<'PY'
          import json
          login = json.load(open('/tmp/read-only-login.json', encoding='utf-8'))
          assert login['role'] == 'ReadOnlyAnalyst'
          assert 'orders.read' in login['permissions']
          assert 'orders.write' not in login['permissions']
          assert 'customers.read' in login['permissions']
          assert 'customers.pii.read' not in login['permissions']
          PY
          CUSTOMER_ID=$(cat /tmp/customer-id)
          curl -fsS "http://127.0.0.1:5100/api/v1/admin/customers/${CUSTOMER_ID}" \
            -H "Authorization: Bearer ${ROLE_TOKEN}" > /tmp/analyst-customer.json
          python3 - <<'PY'
          import json
          customer = json.load(open('/tmp/analyst-customer.json', encoding='utf-8'))
          assert customer['fullName'].startswith('مشتری ')
          assert customer['mobile'] == 'مخفی بر اساس نقش'
          assert customer['normalizedMobile'] == ''
          assert customer['addresses'] == []
          PY
          EXPORT_STATUS=$(curl -s -o /tmp/read-only-customers.csv -w '%{http_code}' "http://127.0.0.1:5100/api/v1/admin/customers/export.csv?q=09120000000" \
            -H "Authorization: Bearer ${ROLE_TOKEN}")
          test "${EXPORT_STATUS}" = "403"
          ! grep -q "09120000000\|تست CI" /tmp/read-only-customers.csv
          curl -fsS http://127.0.0.1:5100/api/v1/admin/dashboard \
            -H "Authorization: Bearer ${ROLE_TOKEN}" > /tmp/read-only-dashboard.json
          ROLE_FORBIDDEN_STATUS=$(curl -s -o /tmp/read-only-forbidden.json -w '%{http_code}' -X POST http://127.0.0.1:5100/api/v1/admin/inventory/adjust \
            -H "Authorization: Bearer ${ROLE_TOKEN}" -H 'Content-Type: application/json' \
            --data '{"sku":"PI-AKB-250","quantityDelta":1,"reason":"must-be-forbidden"}')
          test "${ROLE_FORBIDDEN_STATUS}" = "403"
          curl -fsS http://127.0.0.1:5100/api/v1/admin/dashboard -H "Authorization: Bearer ${ROLE_TOKEN}" > /tmp/read-only-dashboard.json
          python3 - <<'PY'
          import json
          dashboard = json.load(open('/tmp/read-only-dashboard.json', encoding='utf-8'))
          assert dashboard['financialsVisible'] is True
          PY
          stop_role_api

          ADMIN_ROLE=SalesOperator start_role_api
          curl -fsS -X POST http://127.0.0.1:5100/api/v1/admin/auth/login \
            -H 'Content-Type: application/json' \
            --data '{"email":"ci-owner@mazeduneh.test","password":"Mazeduneh-CI-Owner-Password!"}' > /tmp/sales-login.json
          SALES_TOKEN=$(python3 -c "import json; print(json.load(open('/tmp/sales-login.json'))['accessToken'])")
          curl -fsS http://127.0.0.1:5100/api/v1/admin/dashboard \
            -H "Authorization: Bearer ${SALES_TOKEN}" > /tmp/sales-dashboard.json
          python3 - <<'PY'
          import json
          login = json.load(open('/tmp/sales-login.json', encoding='utf-8'))
          dashboard = json.load(open('/tmp/sales-dashboard.json', encoding='utf-8'))
          assert login['role'] == 'SalesOperator'
          assert 'dashboard.read' in login['permissions']
          assert 'reports.read' not in login['permissions']
          assert dashboard['financialsVisible'] is False
          assert dashboard['paidRevenue'] == 0
          assert dashboard['todayRevenue'] == 0
          assert dashboard['periodRevenue'] == 0
          assert dashboard['averageOrderValue'] == 0
          PY
          ANALYTICS_STATUS=$(curl -s -o /tmp/sales-analytics.json -w '%{http_code}' http://127.0.0.1:5100/api/v1/admin/analytics \
            -H "Authorization: Bearer ${SALES_TOKEN}")
          test "${ANALYTICS_STATUS}" = "403"
          stop_role_api
          start_api
          curl -fsS "http://127.0.0.1:5099/api/v1/checkout/orders/${ORDER_ID}?receiptToken=${RECEIPT_TOKEN}" > /tmp/order-delivered-after-restart.json
          python3 - <<'PY'
          import json
          order = json.load(open('/tmp/order-delivered-after-restart.json', encoding='utf-8'))
          assert order['state'] == 'Delivered'
          assert [item['state'] for item in order['transitions']] == ['AwaitingPayment','Paid','Preparing','Shipped','Delivered']
          PY

      - name: API readiness failure and recovery contract
        env:
          READINESS_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: python3 scripts/tests/api_readiness.py

      - name: API request correlation and log redaction contract
        run: python3 scripts/tests/api_observability.py

      - name: Order contact privacy and documents HTTP contract
        run: python3 scripts/tests/order_privacy.py

      - name: Notification role projection contract
        run: python3 scripts/tests/notification_permissions.py

      - name: Zero initial stock catalog regression
        run: python3 scripts/tests/catalog_initial_stock.py

      - name: Corporate planning queue contract
        run: python3 scripts/tests/corporate_planning.py

      - name: Inventory receipt validation units
        run: dotnet run --project services/api.tests/Mazeduneh.Api.Tests.csproj --configuration Release

      - name: Dated inventory purchase contract
        run: python3 scripts/tests/inventory_purchase.py

      - name: Membership invitation and persisted authorization contract
        run: python3 scripts/tests/admin_membership_login.py

      - name: Batch selling price contract and snapshot regression
        run: python3 scripts/tests/inventory_pricing.py

  admin:
    name: Admin Flutter
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.7
          channel: stable
          cache: true
      - name: Generate platform runners
        run: flutter create --platforms=android,web --project-name mazeduneh_admin .
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Build active admin web
        run: flutter build web --release --target lib/secure_main.dart
      - name: Verify generated Android runner
        run: test -f android/app/build.gradle.kts || test -f android/app/build.gradle
      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: mazeduneh-admin-web
          path: apps/admin/build/web
